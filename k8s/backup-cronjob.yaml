apiVersion: batch/v1
kind: CronJob
metadata:
  name: llm-status-db-backup
  namespace: deep-point-process
  labels:
    app: nautilus-llm-status
    component: db-backup
spec:
  # Every 2 hours (emptyDir means data loss on reschedule)
  schedule: "0 */2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600

  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            component: db-backup
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: OnFailure

          containers:
          - name: backup
            image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                TAG="[db-backup]"

                echo "$TAG Starting at $(date -u)"

                # Download consistent DB snapshot via backup endpoint.
                # Uses cluster-internal Service DNS — traffic stays within K8s pod
                # network, never traverses public internet. TLS terminates at ingress.
                wget -q -O /tmp/nautilus-status.db \
                  --header="Authorization: Bearer $BACKUP_TOKEN" \
                  "http://llm-status-service.deep-point-process.svc.cluster.local:8080/api/v1/backup"
                SIZE=$(stat -c%s /tmp/nautilus-status.db 2>/dev/null || echo "?")
                echo "$TAG Downloaded DB snapshot ($SIZE bytes)"

                # Upload to S3
                mc --config-dir /tmp/mc alias set nautilus "$S3_ENDPOINT" "$S3_ACCESS_KEY" "$S3_SECRET_KEY"

                TS=$(date -u +%Y%m%d-%H%M%S)
                mc --config-dir /tmp/mc cp /tmp/nautilus-status.db "nautilus/$S3_BUCKET/backups/nautilus-status-${TS}.db"
                mc --config-dir /tmp/mc cp /tmp/nautilus-status.db "nautilus/$S3_BUCKET/nautilus-status.db"

                echo "$TAG Uploaded: nautilus-status-${TS}.db"

                # Prune backups older than 7 days.
                # minio/mc image has no grep/sed/head — use mc rm with --older-than.
                echo "$TAG Pruning backups older than 7 days..."
                mc --config-dir /tmp/mc rm --older-than 168h --force "nautilus/$S3_BUCKET/backups/" || true

                echo "$TAG Done at $(date -u)"

            envFrom:
            - secretRef:
                name: llm-status-s3-credentials
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 100m
                memory: 256Mi
